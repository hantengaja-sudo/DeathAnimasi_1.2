name: Build DeathDimension

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file dari repo
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Siapkan source (otomatis unzip kalau kamu upload zip)
        run: |
          if [ -f pom.xml ]; then
            echo "SRC=." >> "$GITHUB_ENV"
          else
            unzip -oq ./*.zip -d src_unzipped
            echo "SRC=src_unzipped" >> "$GITHUB_ENV"
          fi

      - name: Build jar
        working-directory: ${{ env.SRC }}
        run: mvn -B package

      - name: Simpan jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-jar
          path: ${{ env.SRC }}/target/DeathDimension.jar
